[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "otter"
version = "0.1.0"
description = "Electronic and ionic structure calculations for dense plasmas based on the work of Starrett and Saumon 2013/2014."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "BSD-3-Clause"}
authors = [{name = "Chongbing Qu"}]
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "numba",
]

[project.optional-dependencies]
dev = [
  "pytest",
]
docs = [
  "sphinx==8.2.3",
  "sphinx-rtd-theme",
  "sphinx-toolbox",
  "sphinx-gallery",
  "sphinxcontrib-bibtex",
]

[tool.setuptools.packages.find]
where = ["src"]
