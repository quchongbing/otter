[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "otter"
version = "0.2.1"
description = "Average-atom, pseudoatom, and ionic-structure calculations for dense plasmas."
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Chongbing Qu"}, {name = "Dominik Kraus"}]
keywords = [
  "average atom",
  "dense plasma",
  "ionic structure",
  "pseudoatom",
  "warm dense matter",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.13,<2",
  "numba>=0.60,<1",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
libxc = ["pylibxc7==7.0.0"]

[tool.poetry.group.dev.dependencies]
build = ">=1.2"
pytest = ">=8"
twine = ">=5"

[tool.poetry.group.docs.dependencies]
sphinx = "==8.2.3"
sphinx-rtd-theme = "*"
sphinx-gallery = "*"
sphinxcontrib-bibtex = "*"

[project.urls]
Homepage = "https://github.com/otter-hed/otter"
Documentation = "https://otter-hed.github.io/otter/"
Repository = "https://github.com/otter-hed/otter"
Issues = "https://github.com/otter-hed/otter/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
otter = ["literature.bib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.black]
line-length = 88
target-version = ["py312"]
