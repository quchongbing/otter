<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
  <title id="title">Average-atom radial domains</title>
  <desc id="desc">A schematic showing the Wigner-Seitz, B3 cut and fit, source trust, scattering match, continuum solve, common production domain, and optional experimental bound-only extension.</desc>
  <defs>
    <style>
      .title{font-family:sans-serif;font-size:27px;font-weight:700;fill:#172033}
      .head{font-family:sans-serif;font-size:15px;font-weight:700;fill:#172033}
      .txt{font-family:sans-serif;font-size:13px;fill:#334155}
      .small{font-family:sans-serif;font-size:12px;fill:#475569}
      .axis{stroke:#1e293b;stroke-width:3}.tick{stroke:#1e293b;stroke-width:2}
      .experimental{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:8 6}
    </style>
  </defs>
  <rect width="1500" height="500" fill="#f8fafc"/>
  <text x="750" y="38" text-anchor="middle" class="title">Radial domains are different numerical objects</text>

  <rect x="80" y="75" width="650" height="42" rx="9" fill="#dbeafe"/>
  <text x="95" y="101" class="head">Direct A3 continuum propagation and integration</text>
  <rect x="410" y="125" width="225" height="42" rx="9" fill="#fef08a"/>
  <text x="425" y="151" class="head">local B3 fit stencil</text>
  <rect x="400" y="175" width="625" height="42" rx="9" fill="#fde68a"/>
  <text x="415" y="201" class="head">accepted B3 replaces the far field</text>
  <rect x="610" y="225" width="120" height="42" rx="9" fill="#ddd6fe"/>
  <text x="625" y="251" class="head">match window</text>
  <rect x="595" y="275" width="430" height="42" rx="9" fill="#fce7f3"/>
  <text x="610" y="301" class="head">optional source-closure blend/outer source</text>
  <rect x="80" y="325" width="945" height="42" rx="9" fill="#dcfce7"/>
  <text x="95" y="351" class="head">final density / potential / transform / output grid</text>
  <rect x="80" y="375" width="945" height="42" rx="9" fill="#e2e8f0"/>
  <text x="95" y="401" class="head">production bound states share the converged SCF domain</text>
  <rect x="1025" y="375" width="380" height="42" rx="9" class="experimental"/>
  <text x="1040" y="401" class="small">optional bound-only zero extension (off by default)</text>

  <line x1="80" y1="455" x2="1410" y2="455" class="axis"/>
  <g>
    <line x1="225" y1="435" x2="225" y2="470" class="tick"/>
    <text x="225" y="487" text-anchor="middle" class="head">R_WS</text>
    <line x1="400" y1="435" x2="400" y2="470" class="tick"/>
    <text x="400" y="487" text-anchor="middle" class="head">R_cut</text>
    <line x1="635" y1="435" x2="635" y2="470" class="tick"/>
    <text x="635" y="487" text-anchor="middle" class="head">R_fit,max</text>
    <line x1="680" y1="435" x2="680" y2="470" class="tick"/>
    <text x="680" y="428" text-anchor="middle" class="small">R_trust</text>
    <line x1="730" y1="435" x2="730" y2="470" class="tick"/>
    <text x="730" y="487" text-anchor="middle" class="head">R_DFT,max</text>
    <line x1="1025" y1="435" x2="1025" y2="470" class="tick"/>
    <text x="1025" y="487" text-anchor="middle" class="head">R_max</text>
    <line x1="1405" y1="435" x2="1405" y2="470" class="tick"/>
    <text x="1405" y="487" text-anchor="middle" class="small">optional R_bound,max</text>
  </g>
  <text x="1010" y="92" class="small">schematic only; actual resolved radii are saved in metadata</text>
</svg>
