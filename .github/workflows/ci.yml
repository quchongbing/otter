name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[docs]"
      - name: Build documentation with warnings as errors
        run: make -C docs strict
      - uses: actions/upload-artifact@v4
        with:
          name: otter-html-docs
          path: docs/build/html
          if-no-files-found: error

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install release tools
        run: python -m pip install -e ".[dev]"
      - name: Build and check wheel and source distribution
        run: |
          python -m build
          python -m twine check dist/*
      - name: Test the installed wheel outside the source tree
        run: |
          python -m venv /tmp/otter-wheel
          /tmp/otter-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/otter-wheel/bin/python -c "import otter; print(otter.__all__)"
      - name: Rebuild and test from the source distribution
        run: |
          mkdir -p /tmp/otter-sdist
          tar -xzf dist/*.tar.gz -C /tmp/otter-sdist
          sdist_root="$(find /tmp/otter-sdist -mindepth 1 -maxdepth 1 -type d -print -quit)"
          python -m build --wheel --outdir /tmp/otter-sdist-wheel "$sdist_root"
          PYTHONPATH="$sdist_root/src" pytest -q "$sdist_root/tests"
