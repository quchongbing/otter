name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-smoke:
    name: Install (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Poetry
        run: python -m pip install "poetry==2.1.3"
      - name: Install package
        run: poetry install --no-interaction
      - name: Import installed package
        run: poetry run python -c "import otter; from otter import PlasmaWorkflowConfig; print(otter.__version__)"

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Poetry
        run: python -m pip install "poetry==2.1.3"
      - name: Install
        run: poetry install --no-interaction
      - name: Test
        run: poetry run pytest -q

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Poetry
        run: python -m pip install "poetry==2.1.3"
      - name: Install
        run: poetry install --no-interaction
      - name: Build documentation with warnings as errors
        run: poetry run make -C docs strict
      - uses: actions/upload-artifact@v4
        with:
          name: otter-html-docs
          path: docs/build/html
          if-no-files-found: error

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Poetry
        run: python -m pip install "poetry==2.1.3"
      - name: Install release tools
        run: poetry install --no-interaction
      - name: Build and check wheel and source distribution
        run: |
          poetry run python -m build
          poetry run python -m twine check dist/*
      - name: Test the installed wheel outside the source tree
        run: |
          python -m venv /tmp/otter-wheel
          /tmp/otter-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/otter-wheel/bin/python -c "import otter; print(otter.__all__)"
      - name: Rebuild and test from the source distribution
        run: |
          mkdir -p /tmp/otter-sdist
          tar -xzf dist/*.tar.gz -C /tmp/otter-sdist
          sdist_root="$(find /tmp/otter-sdist -mindepth 1 -maxdepth 1 -type d -print -quit)"
          poetry run python -m build --wheel --outdir /tmp/otter-sdist-wheel "$sdist_root"
          PYTHONPATH="$sdist_root/src" poetry run pytest -q "$sdist_root/tests"
